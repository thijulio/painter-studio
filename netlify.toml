# Netlify — Painter Studio
# Requer env var NODE_AUTH_TOKEN (GitHub PAT com `read:packages`) p/ instalar @thijulio/biome-tokens.
[build]
  command = "pnpm install --frozen-lockfile && pnpm --filter @painter-studio/mobile build"
  publish = "apps/mobile/dist"

[build.environment]
  NODE_VERSION = "24"

[functions]
  directory = "functions"
  node_bundler = "esbuild"
